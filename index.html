<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #8B0000;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
        }

        .slide.active {
            display: flex;
        }

        /* 第1、3、5页的背景图 */
        .slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.5);
        }

        .slide-content {
            position: relative;
            z-index: 2;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .nav {
            position: fixed;
            bottom: 28px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 10;
        }

        .nav button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .nav button:active {
            background: rgba(255, 255, 255, 0.45);
        }
    </style>
</head>
<body>

    <!-- 第1页：有背景图 -->
    <div class="slide active" data-bg="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=2070&auto=format&fit=crop">
        <img class="slide-bg" src="" alt="背景图">
        <div class="slide-content">
            <img class="avatar" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="头像">
            <h1>第一页</h1>
            <p>这里可以放你的自我介绍</p>
        </div>
    </div>

    <!-- 第2页：暗红色背景 -->
    <div class="slide">
        <div class="slide-content">
            <h1>第二页</h1>
            <p>暗红色主题页</p>
        </div>
    </div>

    <!-- 第3页：有背景图 -->
    <div class="slide" data-bg="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop">
        <img class="slide-bg" src="" alt="背景图">
        <div class="slide-content">
            <img class="avatar" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="头像">
            <h1>第三页</h1>
            <p>这里可以展示你的作品</p>
        </div>
    </div>

    <!-- 第4页：暗红色背景 -->
    <div class="slide">
        <div class="slide-content">
            <h1>第四页</h1>
            <p>暗红色主题页</p>
        </div>
    </div>

    <!-- 第5页：有背景图 -->
    <div class="slide" data-bg="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1948&auto=format&fit=crop">
        <img class="slide-bg" src="" alt="背景图">
        <div class="slide-content">
            <img class="avatar" src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="头像">
            <h1>第五页</h1>
            <p>最后一页</p>
        </div>
    </div>

    <!-- 底部翻页按钮 -->
    <div class="nav">
        <button id="prevBtn">◀</button>
        <button id="nextBtn">▶</button>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        let index = 0;

        function showSlide(i) {
            slides.forEach(s => s.classList.remove('active'));
            slides[i].classList.add('active');

            const bgUrl = slides[i].getAttribute('data-bg');
            const bgImg = slides[i].querySelector('.slide-bg');
            if (bgUrl && bgImg) {
                bgImg.src = bgUrl;
            }
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            index = (index - 1 + slides.length) % slides.length;
            showSlide(index);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            index = (index + 1) % slides.length;
            showSlide(index);
        });
    </script>

</body>
</html>
